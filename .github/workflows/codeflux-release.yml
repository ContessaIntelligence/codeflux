name: codeflux-release

# Builds CodeFlux for Windows, Linux and macOS and publishes the files to a GitHub release.
#
#   - Push a tag such as `v2.1.4`, or
#   - run this workflow by hand (Actions > codeflux-release > Run workflow) and enter the version.
#
# Nothing here is signed: Windows shows a SmartScreen warning and macOS needs `xattr -cr CodeFlux.app` after
# extracting. See packages/codeflux/SPEC.md, section 14.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and release, for example 2.1.4"
        required: true
        type: string

concurrency:
  group: codeflux-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, runner: windows-2025 }
          - { name: linux-x64, runner: ubuntu-24.04 }
          # macos-latest is Apple Silicon. An Intel build would need `macos-15-intel`.
          - { name: macos-arm64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RAW_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # The CLI and the desktop app both read OPENCODE_VERSION; a tag like v2.1.4 becomes 2.1.4.
      - name: Normalize version
        run: echo "OPENCODE_VERSION=${RAW_VERSION#v}" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4

      - name: Set up rpm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      # The desktop app bundles the CLI. It is built on the `latest` channel: the desktop looks for the service
      # registration `service.json`, which only that channel writes.
      - name: Build CLI
        working-directory: packages/cli
        run: bun run script/build.ts --single --baseline --skip-install
        env:
          OPENCODE_CHANNEL: latest

      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build
        env:
          OPENCODE_CHANNEL: prod
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Pack desktop
        working-directory: packages/desktop
        timeout-minutes: 60
        run: bun run pack
        env:
          OPENCODE_CHANNEL: prod

      # `pack` leaves the unpacked app on Windows; the installer is built around that app in a second pass.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        working-directory: packages/desktop
        timeout-minutes: 30
        run: |
          mkdir -p "$RUNNER_TEMP/staged"
          cp -r ../../dist/desktop/app "$RUNNER_TEMP/staged/app"
          OPENCODE_DESKTOP_APP="$RUNNER_TEMP/staged/app" bun run pack
          (cd "$RUNNER_TEMP/staged/app" && 7z a -tzip "$GITHUB_WORKSPACE/dist/CodeFlux-windows-x64-portable.zip" .)
        env:
          OPENCODE_CHANNEL: prod

      - name: Collect files
        run: |
          mkdir -p release
          for f in dist/desktop/opencode-desktop-*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            cp "$f" "release/CodeFlux-${name#opencode-desktop-}"
          done
          [ -f dist/CodeFlux-windows-x64-portable.zip ] && cp dist/CodeFlux-windows-x64-portable.zip release/ || true
          ls -la release
          [ -n "$(ls release)" ] || { echo "No release files were produced"; exit 1; }

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeflux-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: codeflux-*
          path: release
          merge-multiple: true

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        run: |
          tag="v${VERSION#v}"
          gh release create "$tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CodeFlux ${tag#v}" \
            --notes "CodeFlux ${tag#v}. Unsigned builds: on Windows choose More info > Run anyway; on macOS run \`xattr -cr CodeFlux.app\` after extracting." \
          || gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
